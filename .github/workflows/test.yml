name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install '.[bedrock,dev]'
      - name: Verify Strands and Bedrock imports
        run: python -c 'from strands import Agent, tool; from strands.models import BedrockModel; print(Agent, tool, BedrockModel)'
      - run: python -m pytest -q
      - run: python scripts/demo.py
      - name: Verify trust gate
        shell: bash
        run: |
          set +e
          python -m docgov --root . --json verify --strict > "$RUNNER_TEMP/docgov-verify.json"
          status=$?
          cat "$RUNNER_TEMP/docgov-verify.json"
          if [ "${GITHUB_HEAD_REF:-}" = "demo/ai-document-drift" ]; then
            test "$status" -eq 2
            python -c 'import json,sys; assert json.load(open(sys.argv[1]))["result"] == "action_required"' "$RUNNER_TEMP/docgov-verify.json"
          else
            test "$status" -eq 0
          fi
