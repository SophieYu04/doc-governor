name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install '.[bedrock,dev]'
      - name: Verify Strands and Bedrock imports
        run: python -c 'from strands import Agent, tool; from strands.models import BedrockModel; print(Agent, tool, BedrockModel)'
      - run: python -m pytest -q
      - run: python scripts/demo.py
      - run: python -m docgov --root . --json verify --strict
