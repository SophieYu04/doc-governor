name: Doc Governor review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  checks: write
  id-token: write

jobs:
  govern:
    if: github.event.action != 'labeled' || github.event.label.name == 'docgov-approved'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out PR as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exchange GitHub OIDC token for the Bedrock role
        if: github.event.pull_request.head.repo.full_name == github.repository && vars.DOCGOV_AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.DOCGOV_AWS_ROLE_ARN }}
          aws-region: us-west-2
      - name: Run Doc Governor
        uses: SophieYu04/doc-governor@v0.2.3
        with:
          mode: review
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          apply: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          approved: ${{ github.event.action == 'labeled' && github.event.label.name == 'docgov-approved' }}
          enable_model: ${{ github.event.pull_request.head.repo.full_name == github.repository && vars.DOCGOV_AWS_ROLE_ARN != '' }}
          aws_region: us-west-2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
