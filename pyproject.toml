[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-governor"
version = "0.1.0"
description = "A Strands-powered GitHub agent that governs AI-generated Markdown."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sophie Yu" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
bedrock = [
  "boto3>=1.34",
  "pydantic>=2.0",
  "strands-agents>=1.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
docgov = "docgov.cli:main"

[tool.setuptools.packages.find]
include = ["docgov*"]
